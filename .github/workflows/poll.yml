# BEYONDconnect background poll — the 5-minute scheduler.
#
# NOTE: GitHub only registers the cron schedule when this file is committed
# to main. If scheduled runs ever stop firing, re-commit this file to
# re-register the schedule (a manual run does NOT re-register it).
name: BEYONDconnect background poll
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot car state
        run: |
          curl -s -f -H "X-App-Key: ${{ secrets.BEYOND_PASSWORD }}" \
            https://beyondconnect.vercel.app/api/poll
